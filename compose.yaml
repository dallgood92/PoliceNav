services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: blockwatch
      POSTGRES_USER: blockwatch
      POSTGRES_PASSWORD: blockwatch_local
    ports:
      - "5432:5432"
    volumes:
      - blockwatch_postgres:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockwatch -d blockwatch"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - blockwatch_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  blockwatch_postgres:
  blockwatch_redis:
